<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Calmpage のアイコン「月の出」。紙の上で、水平線から半分出た月の下半分が水面の映り（本文の行にも見える）になる。
       映りの縞の幅は半径 180 の円の弦の長さ。32px 以下では .shine（淡い下 2 本）を消す -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfc"/><stop offset="1" stop-color="#efefeb"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <path d="M332 524 A180 180 0 0 1 692 524 Z" fill="url(#ink)"/>
  <rect clip-path="url(#sq)" x="100" y="518" width="824" height="12" fill="#1a1a1a" fill-opacity="0.55"/>
  <g fill="#1a1a1a">
    <rect x="334.5" y="546" width="355" height="16" rx="8" fill-opacity="0.6"/>
    <rect x="343.8" y="580" width="336.5" height="16" rx="8" fill-opacity="0.45"/>
    <rect x="361" y="614" width="302" height="16" rx="8" fill-opacity="0.32"/>
    <rect class="shine" x="389.6" y="648" width="244.8" height="16" rx="8" fill-opacity="0.2"/>
    <rect class="shine" x="437.8" y="680" width="148.4" height="16" rx="8" fill-opacity="0.12"/>
  </g>
</svg>
