<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:" />
    <title>Calmpage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="titlebar">
      <div class="title-left">
      <button id="toggle-sidebar" class="icon-button" aria-pressed="true" data-i18n-title="sidebar.toggle" data-i18n-aria="sidebar.toggle">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" />
        </svg>
      </button>
      <div class="crumbs">
        <span id="folder-name"></span>
        <span class="crumb-sep" id="crumb-sep" hidden>/</span>
        <span id="file-name"></span>
        <span id="dirty" data-i18n-title="title.unsaved" hidden></span>
      </div>
      </div>
      <div class="status">
        <label class="auto" data-i18n-title="auto.hint">
          <input type="checkbox" id="auto" /> <span data-i18n="auto.label"></span>
        </label>
        <span id="engine"></span>
        <button id="status" class="status-pill" data-state="idle"><i></i><span id="status-text"></span></button>
        <button id="toggle-preview" class="icon-button" aria-pressed="true" data-i18n-title="preview.toggle" data-i18n-aria="preview.toggle">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" /><path d="M15 3v18" />
          </svg>
        </button>
        <button id="toggle-ai" class="icon-button" aria-pressed="false" data-i18n-title="ai.toggle" data-i18n-aria="ai.toggle">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
            <path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" />
          </svg>
        </button>
      </div>
    </header>

    <div id="welcome">
      <p class="welcome-title">Calmpage</p>
      <p data-i18n="welcome.body"></p>
      <button id="open-folder"><span data-i18n="welcome.open"></span> <kbd>⌘O</kbd></button>
      <button id="new-document" class="link-button"><span data-i18n="welcome.new"></span> ⇧⌘N</button>
    </div>

    <main id="workspace">
      <nav id="sidebar">
        <ul id="file-list"></ul>
      </nav>

      <section id="editor-col">
        <div id="editor"></div>
        <section id="problems" hidden>
          <header><span id="problems-title"></span><button id="problems-close" data-i18n-title="problems.close" data-i18n-aria="problems.close">×</button></header>
          <ul id="problem-list"></ul>
        </section>
      </section>

      <div id="divider" data-i18n-title="divider.hint"></div>

      <section id="preview-col">
        <div id="pdf-bar">
          <label class="pdf-pages" data-i18n-title="pdf.page">
            <input id="pdf-page" inputmode="numeric" autocomplete="off" spellcheck="false" data-i18n-aria="pdf.page" />
            <span id="pdf-total"></span>
          </label>
          <span id="pdf-zoom" data-i18n-title="pdf.zoomHint"></span>
          <div class="segmented pdf-views" id="pdf-views" data-setting="pdfView">
            <button data-value="width" data-i18n-title="pdf.viewWidth" data-i18n-aria="pdf.viewWidth">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18" /><path d="m7 8-4 4 4 4" /><path d="m17 8 4 4-4 4" /></svg>
            </button>
            <button data-value="page" data-i18n-title="pdf.viewPage" data-i18n-aria="pdf.viewPage">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2" /></svg>
            </button>
            <button data-value="spread" data-i18n-title="pdf.viewSpread" data-i18n-aria="pdf.viewSpread">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="8.5" height="14" rx="1.5" /><rect x="13" y="5" width="8.5" height="14" rx="1.5" /></svg>
            </button>
          </div>
        </div>
        <div id="pdf-find" hidden>
          <input id="pdf-find-input" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="pdf.find" data-i18n-aria="pdf.find" />
          <span id="pdf-find-count"></span>
          <button id="pdf-find-prev" class="icon-button" data-i18n-title="pdf.findPrev" data-i18n-aria="pdf.findPrev">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
          </button>
          <button id="pdf-find-next" class="icon-button" data-i18n-title="pdf.findNext" data-i18n-aria="pdf.findNext">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <button id="pdf-find-close" class="icon-button" data-i18n-title="pdf.findClose" data-i18n-aria="pdf.findClose">×</button>
        </div>
        <div id="pdf-scroll" tabindex="-1"></div>
        <p id="pdf-note" hidden></p>
        <p id="pdf-hint" data-i18n="pdf.hint"></p>
      </section>

      <div id="ai-divider" data-i18n-title="divider.hint"></div>

      <section id="ai-col">
        <header class="ai-head">
          <div id="ai-tabs" role="tablist"></div>
          <div class="agent-picker-wrap">
            <button id="new-tab" class="icon-button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="ai.newTab" data-i18n-aria="ai.newTab">
              <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
            </button>
            <div id="agent-menu" role="menu" hidden></div>
          </div>
          <button id="new-thread" class="icon-button" data-i18n-title="ai.newThread" data-i18n-aria="ai.newThread">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" /></svg>
          </button>
          <span id="ai-folder"></span>
        </header>
        <div class="ai-context">
          <span data-i18n="ai.context"></span>
          <button id="chip-file" class="chip" data-chip="file"></button>
          <button id="chip-errors" class="chip" data-chip="errors"></button>
          <button id="chip-pdf" class="chip" data-chip="pdf"></button>
        </div>
        <div id="ai-threads"></div>
        <div id="ai-terms" hidden></div>
        <p id="ai-empty" class="thread-hint" data-i18n="ai.noAgents" hidden></p>
      </section>
    </main>

    <button id="open-settings" class="icon-button" data-i18n-title="settings.button" data-i18n-aria="settings.button">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>

    <div id="settings" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="sheet-head">
          <h2 id="settings-title" data-i18n="settings.title"></h2>
          <button id="settings-close" class="sheet-done" data-i18n="settings.close"></button>
        </header>

        <h3 data-i18n="settings.general"></h3>
        <div class="setting-row">
          <span data-i18n="settings.language"></span>
          <div class="segmented" data-setting="language">
            <button data-value="en">English</button>
            <button data-value="ja">日本語</button>
          </div>
        </div>
        <div class="setting-row">
          <div>
            <label for="settings-auto" data-i18n="settings.autoCompile"></label>
            <p class="setting-hint" data-i18n="settings.autoCompileHint"></p>
          </div>
          <input type="checkbox" id="settings-auto" class="switch" />
        </div>
        <div class="setting-row">
          <div>
            <label for="settings-ai" data-i18n="settings.aiEnabled"></label>
            <p class="setting-hint" data-i18n="settings.aiEnabledHint"></p>
          </div>
          <input type="checkbox" id="settings-ai" class="switch" />
        </div>

        <div id="settings-agents">
          <h3 data-i18n="settings.agents"></h3>
          <p class="setting-hint" data-i18n="settings.agentsHint"></p>
          <ul id="agent-list" class="agent-list"></ul>
          <div class="agent-actions">
            <button id="agent-browse" class="link-button" aria-expanded="false" data-i18n="settings.registry"></button>
            <button id="agent-restore" class="link-button" data-i18n="settings.restoreDefaults" data-i18n-title="settings.restoreHint"></button>
          </div>
          <div id="registry" hidden>
            <input id="registry-search" type="search" data-i18n-placeholder="settings.registrySearch" />
            <p id="registry-status" class="setting-hint"></p>
            <ul id="registry-list" class="registry-list"></ul>
          </div>
          <p id="agent-form-title" class="agent-form-title"></p>
          <form id="agent-form" class="agent-form">
            <input id="agent-form-name" required data-i18n-placeholder="settings.agentName" />
            <input id="agent-form-command" required data-i18n-placeholder="settings.agentCommand" />
            <div class="segmented" id="agent-form-kind">
              <button type="button" data-value="acp" aria-pressed="true">ACP</button>
              <button type="button" data-value="terminal" aria-pressed="false" data-i18n="settings.kindTerminal"></button>
            </div>
            <div class="agent-form-buttons">
              <button type="button" id="agent-form-cancel" class="link-button" data-i18n="settings.agentCancel" hidden></button>
              <button type="submit" id="agent-form-submit" class="sheet-done"></button>
            </div>
          </form>
        </div>

        <h3 data-i18n="settings.appearance"></h3>
        <div class="setting-row">
          <span data-i18n="settings.theme"></span>
          <div class="segmented" data-setting="theme">
            <button data-value="system" data-i18n="theme.system"></button>
            <button data-value="light" data-i18n="theme.light"></button>
            <button data-value="dark" data-i18n="theme.dark"></button>
          </div>
        </div>
        <div class="setting-row">
          <span data-i18n="settings.palette"></span>
          <div class="swatches" data-setting="palette">
            <button data-value="paper"><i class="swatch swatch-paper"></i><span data-i18n="palette.paper"></span></button>
            <button data-value="moss"><i class="swatch swatch-moss"></i><span data-i18n="palette.moss"></span></button>
            <button data-value="sand"><i class="swatch swatch-sand"></i><span data-i18n="palette.sand"></span></button>
          </div>
        </div>

        <h3 data-i18n="settings.pdf"></h3>
        <div class="setting-row">
          <span data-i18n="settings.pdfView"></span>
          <div class="segmented" data-setting="pdfView">
            <button data-value="width" data-i18n="pdf.viewWidth"></button>
            <button data-value="page" data-i18n="pdf.viewPage"></button>
            <button data-value="spread" data-i18n="pdf.viewSpread"></button>
          </div>
        </div>
        <div class="setting-row">
          <div>
            <label for="settings-pdf-invert" data-i18n="settings.pdfInvert"></label>
            <p class="setting-hint" data-i18n="settings.pdfInvertHint"></p>
          </div>
          <input type="checkbox" id="settings-pdf-invert" class="switch" />
        </div>
      </section>
    </div>
    <div id="templates" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="templates-title">
        <header class="sheet-head">
          <h2 id="templates-title" data-i18n="template.title"></h2>
          <button id="templates-close" class="sheet-done" data-i18n="unsaved.cancel"></button>
        </header>
        <p class="setting-hint" data-i18n="template.hint"></p>
        <ul class="template-list">
          <li><button data-template="article"><span data-i18n="template.article"></span><span class="template-hint" data-i18n="template.articleHint"></span></button></li>
          <li><button data-template="ltjsarticle"><span data-i18n="template.ltjsarticle"></span><span class="template-hint" data-i18n="template.ltjsarticleHint"></span></button></li>
          <li><button data-template="jsarticle"><span data-i18n="template.jsarticle"></span><span class="template-hint" data-i18n="template.jsarticleHint"></span></button></li>
          <li><button data-template="beamer"><span data-i18n="template.beamer"></span><span class="template-hint" data-i18n="template.beamerHint"></span></button></li>
          <li><button data-template="report"><span data-i18n="template.report"></span><span class="template-hint" data-i18n="template.reportHint"></span></button></li>
          <li><button data-template="letter"><span data-i18n="template.letter"></span><span class="template-hint" data-i18n="template.letterHint"></span></button></li>
        </ul>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
